<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nolan · 个人博客</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fff7ef;
      --surface: #fffefb;
      --surface-soft: #fff5e8;
      --surface-strong: #ffedd8;
      --text: #3a2a1e;
      --text-soft: #7a6451;
      --line: #f1dac1;
      --primary: #e98b4a;
      --primary-hover: #d97736;
      --danger: #de5a5a;
      --radius-lg: 24px;
      --radius-md: 16px;
      --shadow: 0 16px 36px rgba(156, 93, 39, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Noto Sans SC', sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #ffe9d4 0, transparent 38%),
        radial-gradient(circle at 100% 0%, #ffe5cf 0, transparent 28%),
        radial-gradient(circle at 50% 100%, #fff2df 0, transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 42px;
    }

    .app {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .sidebar {
      position: sticky;
      top: 24px;
      padding: 24px;
      background: linear-gradient(165deg, #fffefb 0%, #fff5e8 100%);
    }

    .avatar {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      margin-bottom: 16px;
      border: 3px solid #ffe1c2;
      background-image: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Nolan');
      background-size: cover;
      background-position: center;
      box-shadow: 0 8px 20px rgba(217, 119, 54, 0.18);
    }

    .profile-name {
      margin: 0 0 8px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .profile-bio {
      margin: 0;
      color: var(--text-soft);
      font-size: 0.93rem;
      line-height: 1.8;
      white-space: pre-line;
    }

    .admin-card { display: none; }
    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .admin-head strong {
      font-size: 1rem;
      color: var(--primary);
    }

    .exit-admin {
      border: none;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 0.86rem;
      padding: 0;
    }

    .input-title {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 10px;
      outline: none;
      color: var(--text);
    }

    .input-title:focus {
      border-color: #f2b782;
      background: #fffaf4;
    }

    #editor-container {
      height: 220px;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      overflow: hidden;
    }

    .ql-toolbar {
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-color: var(--line) !important;
      background: var(--surface-soft);
    }

    .ql-container {
      border-color: var(--line) !important;
      font-size: 0.95rem;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      padding: 10px 12px;
      font-size: 0.93rem;
      font-weight: 600;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-muted { background: #f8e8d6; color: #865f3e; }
    .btn-muted:hover { background: #f3dcc5; }
    .btn-warning { background: #f3a95f; color: #fff; }
    .btn-warning:hover { background: #e99749; }

    .feed {
      padding: 14px;
      min-height: 500px;
      background: linear-gradient(180deg, #fffefb 0%, #fff7ef 100%);
    }

    .feed-header {
      padding: 20px 18px;
      margin-bottom: 8px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #ea9a58, #f3b37a);
      color: #fffdfb;
      box-shadow: 0 10px 24px rgba(202, 123, 58, 0.25);
    }

    .feed-header h1 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .feed-header p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .feed-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .feed-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .feed-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(156, 93, 39, 0.11);
    }

    .post-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #b5662d;
      background: #fff1df;
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .post-title {
      margin: 0 0 10px;
      font-size: 1.22rem;
      line-height: 1.4;
      font-weight: 800;
      color: #513726;
      word-break: break-word;
    }

    .post-content {
      color: #5f4736;
      line-height: 1.8;
      font-size: 0.96rem;
      word-break: break-word;
    }

    .post-content img {
      max-width: 100%;
      border-radius: 10px;
      margin: 8px 0;
    }

    .post-content blockquote {
      margin: 12px 0;
      padding-left: 12px;
      border-left: 4px solid #f2be8a;
      color: #946d4e;
    }

    .admin-controls {
      display: none;
      margin-top: 14px;
      gap: 8px;
    }

    .admin-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-edit { color: #b5662d; border-color: #f3cb9f; }
    .btn-del { color: var(--danger); border-color: #ffd6d6; }

    .mode-switch {
      position: fixed;
      right: 18px;
      bottom: 18px;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 10px 24px rgba(217, 119, 54, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 100;
    }

    .mode-switch:hover {
      transform: translateY(-2px);
      background: var(--primary-hover);
    }

    .status-box {
      text-align: center;
      color: var(--text-soft);
      padding: 30px 16px;
      font-size: 0.92rem;
    }

    .error-banner {
      background: #fff3f0;
      border: 1px solid #ffcfc7;
      color: #b54737;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 0.9rem;
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }
  </style>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="globalError" style="display:none;position:fixed;top:0;left:0;width:100%;background:#ef4444;color:#fff;text-align:center;padding:10px;z-index:9999;"></div>

  <button class="mode-switch" id="modeSwitch" title="切换Admin模式">⚙️</button>

  <div class="app">
    <aside class="panel sidebar">
      <div id="guestPanel">
        <div class="avatar"></div>
        <h2 class="profile-name">Nolan</h2>
        <p class="profile-bio">New York University Shanghai

乐于探索哲学奥秘
寻找生命意义
热爱前沿科技
自由而有趣的灵魂</p>
      </div>

      <div id="adminPanel" class="admin-card">
        <div class="admin-head">
          <strong id="editorModeText">发布新内容</strong>
          <button class="exit-admin" onclick="switchMode()">退出 Admin</button>
        </div>
        <input type="text" id="postTitle" class="input-title" placeholder="输入标题..." autocomplete="off">
        <div id="editor-container"></div>
        <input type="hidden" id="editingId" value="">
        <button class="btn btn-primary" id="submitBtn">发布 Echo</button>
        <button class="btn btn-muted" id="cancelEditBtn" style="display:none;">取消修改</button>
        <button class="btn btn-warning" onclick="restoreDefaultData()">🔄 一键恢复默认文章</button>
      </div>
    </aside>

    <main class="panel feed">
      <header class="feed-header">
        <h1>Echoes · 时间切片</h1>
        <p>记录思想、学习与生活的小宇宙。</p>
      </header>
      <ul class="feed-list" id="feedList">
        <div class="status-box">
          <div style="display:inline-block;border:3px solid #eef0f6;border-top:3px solid #5b6cff;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;"></div>
          <p id="loadingText">正在初始化系统...</p>
        </div>
      </ul>
    </main>
  </div>

  <script>
    window.onerror = function(msg, url, line, col, error) {
      const errBox = document.getElementById('globalError');
      errBox.style.display = 'block';
      errBox.innerHTML = `⚠️ 程序崩溃: ${msg} (Line: ${line})<br>可能是网络问题导致库未加载，请刷新重试。`;
      return false;
    };

    const SUPABASE_URL = 'https://pukmwienoiknatnpzobk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1a213aWVub2lrbmF0bnB6b2JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyOTYyMjgsImV4cCI6MjA3OTg3MjIyOH0.OXSEMos-dlXKk0exU4e-ZKTFo2vxDpm5jRMCRGqSSp0';

    const ADMIN_PASS = "admin";
    const AUTH_KEY = "is_admin_mode";
    const QUILL_VERSION = "1.3.7";
    const RESOURCE_LOAD_TIMEOUT_MS = 9000;
    const QUILL_CSS_CDNS = [
      `https://cdnjs.cloudflare.com/ajax/libs/quill/${QUILL_VERSION}/quill.snow.min.css`,
      `https://unpkg.com/quill@${QUILL_VERSION}/dist/quill.snow.css`,
      `https://cdn.jsdelivr.net/npm/quill@${QUILL_VERSION}/dist/quill.snow.css`
    ];
    const QUILL_JS_CDNS = [
      `https://cdnjs.cloudflare.com/ajax/libs/quill/${QUILL_VERSION}/quill.min.js`,
      `https://unpkg.com/quill@${QUILL_VERSION}/dist/quill.min.js`,
      `https://cdn.jsdelivr.net/npm/quill@${QUILL_VERSION}/dist/quill.min.js`
    ];
    let supabaseClient = null;
    let quill = null;
    let cachedPosts = [];

    function loadScript(src, { timeout = RESOURCE_LOAD_TIMEOUT_MS, loadedCheck } = {}) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) {
          if (!loadedCheck || loadedCheck()) return resolve();
          existing.addEventListener('load', () => resolve(), { once: true });
          existing.addEventListener('error', () => reject(new Error(`脚本加载失败: ${src}`)), { once: true });
          return;
        }

        const script = document.createElement('script');
        script.src = src;
        script.async = true;

        const timer = setTimeout(() => {
          script.remove();
          reject(new Error(`脚本加载超时: ${src}`));
        }, timeout);

        script.onload = () => {
          clearTimeout(timer);
          resolve();
        };
        script.onerror = () => {
          clearTimeout(timer);
          script.remove();
          reject(new Error(`脚本加载失败: ${src}`));
        };
        document.head.appendChild(script);
      });
    }

    function loadStylesheet(href, { timeout = RESOURCE_LOAD_TIMEOUT_MS } = {}) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`link[href="${href}"]`);
        if (existing) return resolve();

        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;

        const timer = setTimeout(() => {
          link.remove();
          reject(new Error(`样式加载超时: ${href}`));
        }, timeout);

        link.onload = () => {
          clearTimeout(timer);
          resolve();
        };
        link.onerror = () => {
          clearTimeout(timer);
          link.remove();
          reject(new Error(`样式加载失败: ${href}`));
        };

        document.head.appendChild(link);
      });
    }

    async function loadWithFallback(urls, loader, loadedCheck) {
      let lastErr = null;
      for (const url of urls) {
        try {
          if (loadedCheck()) return;
          await loader(url, { timeout: RESOURCE_LOAD_TIMEOUT_MS, loadedCheck });
          if (loadedCheck()) return;
        } catch (err) {
          lastErr = err;
        }
      }
      if (!loadedCheck()) {
        throw lastErr || new Error('资源加载失败');
      }
    }

    async function ensureQuillLoaded() {
      if (typeof Quill !== 'undefined') return;
      await loadWithFallback(QUILL_CSS_CDNS, loadStylesheet, () => !!document.querySelector('link[href*="quill"][rel="stylesheet"]'));
      await loadWithFallback(QUILL_JS_CDNS, loadScript, () => typeof Quill !== 'undefined');
      if (typeof Quill === 'undefined') {
        throw new Error("Quill 编辑器库加载失败：已尝试多个 CDN。请检查网络（尤其是 Edge 的网络策略）后刷新。");
      }
    }

    async function initApp() {
      try {
        await ensureQuillLoaded();

        quill = new Quill('#editor-container', {
          theme: 'snow',
          placeholder: '写点什么...',
          modules: { toolbar: [['bold', 'italic', 'underline', 'strike'], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['link', 'image', 'code-block']] }
        });

        if (typeof window.supabase === 'undefined') {
          throw new Error("Supabase SDK 加载失败，请检查网络。");
        }

        if (SUPABASE_URL.includes('你的URL') || SUPABASE_KEY.includes('你的KEY')) {
          throw new Error("检测到未配置 Supabase URL/Key。<br>请用记事本打开 index.html，填入正确的配置。");
        }

        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('modeSwitch').onclick = switchMode;
        document.getElementById('submitBtn').onclick = handleSubmit;
        document.getElementById('cancelEditBtn').onclick = resetEditor;

        await fetchPosts();
      } catch (e) {
        showError(e.message);
        if (document.getElementById('modeSwitch')) {
          document.getElementById('modeSwitch').onclick = switchMode;
        }
      }
    }

    async function fetchPosts() {
      document.getElementById('loadingText').innerText = "正在连接云端数据库...";

      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error(error);
        showError(`数据库连接错误: ${error.message}<br>可能原因: 项目暂停(Paused) 或 RLS 权限未开。`);
        return;
      }

      if (!data || data.length === 0) {
        document.getElementById('feedList').innerHTML = `
          <div class="status-box">
            <h3 style="margin:0 0 8px;color:#27304a;">📭 数据库已连接，但没有文章</h3>
            <p style="margin:0;">请点击右下角 ⚙️ 进入 Admin，使用“一键恢复默认文章”功能。</p>
          </div>`;
        return;
      }

      cachedPosts = data;
      renderFeed(data);
    }

    function renderFeed(posts) {
      const list = document.getElementById('feedList');
      list.innerHTML = '';
      const adminMode = localStorage.getItem(AUTH_KEY) === '1';

      posts.forEach(post => {
        const li = document.createElement('li');
        li.className = 'feed-item';
        const adminControls = adminMode ? `
          <div class="admin-controls" style="display:flex;">
            <button class="admin-btn btn-edit" onclick="editPost(${post.id})">编辑</button>
            <button class="admin-btn btn-del" onclick="deletePost(${post.id})">删除</button>
          </div>` : '';

        li.innerHTML = `
          <div class="post-meta">${post.date || '未知日期'}</div>
          <h2 class="post-title">${post.title}</h2>
          <div class="post-content">${post.content}</div>
          ${adminControls}
        `;
        list.appendChild(li);
      });

      updateUIState();
    }

    function showError(msg) {
      document.getElementById('feedList').innerHTML = `<div class="error-banner">❌ ${msg}</div>`;
      document.getElementById('globalError').style.display = 'none';
    }

    async function handleSubmit() {
      const title = document.getElementById('postTitle').value.trim();
      const content = quill.root.innerHTML;
      const editingId = document.getElementById('editingId').value;

      if (!title) { alert("标题不能为空"); return; }

      const btn = document.getElementById('submitBtn');
      btn.textContent = '提交中...';
      btn.disabled = true;

      const now = new Date();
      const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const rawDate = now.toISOString().split('T')[0];

      let error;
      if (editingId) {
        const res = await supabaseClient.from('posts').update({ title, content }).eq('id', editingId);
        error = res.error;
      } else {
        const res = await supabaseClient.from('posts').insert([{ id: Date.now(), title, content, date: dateStr, raw_date: rawDate }]);
        error = res.error;
      }

      btn.disabled = false;
      btn.textContent = editingId ? '保存修改' : '发布 Echo';

      if (error) alert('操作失败：' + error.message);
      else {
        resetEditor();
        fetchPosts();
      }
    }

    window.restoreDefaultData = async function() {
      if (!confirm("确定要重新写入默认文章吗？(不会删除旧数据)")) return;

      const defaultPosts = [
        { id: 1764258833297, title: "2025/11/27", date: "2025年11月27日 · 周四", raw_date: "2025-11-27", content: "<p>有时，我觉得世界是更高维度的...</p>" },
        { id: 1764258740402, title: "项目作品链接", date: "2025年11月27日 · 周四", raw_date: "2025-11-27", content: "<ul><li><a href='#'>我的云盘</a></li></ul>" },
        { id: 1764258281668, title: "Hello World", date: "2025年11月27日 · 周四", raw_date: "2025-11-27", content: "<p>我是 Nolan...</p>" }
      ];

      let count = 0;
      for (let post of defaultPosts) {
        const check = await supabaseClient.from('posts').select('id').eq('id', post.id);
        if (check.data && check.data.length === 0) {
          await supabaseClient.from('posts').insert([post]);
          count++;
        }
      }

      alert(`恢复完成！写入了 ${count} 篇文章。`);
      fetchPosts();
    };

    window.deletePost = async function(id) {
      if (!confirm("删除?")) return;
      const { error } = await supabaseClient.from('posts').delete().eq('id', id);
      if (error) alert('删除失败: ' + error.message);
      else fetchPosts();
    };

    window.editPost = function(id) {
      const post = cachedPosts.find(p => p.id === id);
      if (!post) return;
      document.getElementById('postTitle').value = post.title;
      quill.root.innerHTML = post.content;
      document.getElementById('editingId').value = post.id;
      document.getElementById('editorModeText').textContent = "修改内容";
      document.getElementById('submitBtn').textContent = "保存修改";
      document.getElementById('cancelEditBtn').style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetEditor() {
      document.getElementById('postTitle').value = '';
      quill.root.innerHTML = '';
      document.getElementById('editingId').value = '';
      document.getElementById('editorModeText').textContent = "发布新内容";
      document.getElementById('submitBtn').textContent = "发布 Echo";
      document.getElementById('cancelEditBtn').style.display = "none";
    }

    function updateUIState() {
      const isAdm = localStorage.getItem(AUTH_KEY) === '1';
      document.getElementById('guestPanel').style.display = isAdm ? 'none' : 'block';
      document.getElementById('adminPanel').style.display = isAdm ? 'block' : 'none';
      const controls = document.querySelectorAll('.admin-controls');
      controls.forEach(el => el.style.display = isAdm ? 'flex' : 'none');

      const btn = document.getElementById('modeSwitch');
      if (btn) {
        btn.innerHTML = isAdm ? '↩️' : '⚙️';
        btn.title = isAdm ? '退出Admin' : '进入Admin';
      }
    }

    function switchMode() {
      if (localStorage.getItem(AUTH_KEY) === '1') {
        localStorage.setItem(AUTH_KEY, '0');
        resetEditor();
      } else {
        const pwd = prompt("请输入Admin密码 (默认: admin):");
        if (pwd === ADMIN_PASS) {
          localStorage.setItem(AUTH_KEY, '1');
        } else if (pwd !== null) {
          alert("密码错误");
        }
      }

      updateUIState();
      renderFeed(cachedPosts);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
